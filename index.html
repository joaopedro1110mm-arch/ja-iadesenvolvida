<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>JA Assistente Virtual - MEGA COMPLETA (200+ Comandos)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Outfit', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .assistant-card {
            max-width: 800px;
            width: 100%;
            background: rgba(10, 20, 40, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 2;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
        }

        .header p {
            color: #e0f0ff;
            margin-top: 6px;
            font-size: 0.8rem;
        }

        .history-toggle {
            position: absolute;
            right: 20px;
            top: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.7rem;
            z-index: 10;
        }

        .history-panel {
            position: fixed;
            right: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: rgba(10, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 255, 255, 0.3);
            transition: right 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .history-panel.open {
            right: 0;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
        }

        .history-header h3 {
            color: #FFD700;
            font-size: 1rem;
        }

        .close-history {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.7rem;
            color: #ccc;
        }

        .history-item .time {
            color: #FFD700;
            font-size: 0.6rem;
        }

        .chat-area {
            height: 380px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(5, 10, 25, 0.5);
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            flex-direction: row-reverse;
        }

        .user-message .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 24px 24px 4px 24px;
        }

        .bot-message .bubble {
            background: rgba(20, 30, 55, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #e2f0ff;
            border-radius: 24px 24px 24px 4px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user-message .avatar {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 18px;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px #667eea;
        }

        .status {
            font-size: 0.7rem;
            text-align: center;
            padding: 10px;
            color: #88aaff;
            border-top: 1px solid rgba(0,255,255,0.2);
        }

        .mic-active {
            animation: pulseMic 1s infinite;
        }

        @keyframes pulseMic {
            0% { box-shadow: 0 0 0 0 #d4ff00; }
            100% { box-shadow: 0 0 0 10px rgba(212,255,0,0); }
        }

        @media (max-width: 550px) {
            .assistant-card { margin: 10px; }
            .bubble { max-width: 85%; font-size: 0.8rem; }
            button { padding: 6px 12px; font-size: 0.7rem; }
            .history-panel { width: 100%; right: -100%; }
            .header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<canvas id="particlesCanvas"></canvas>

<div class="history-panel" id="historyPanel">
    <div class="history-header">
        <h3>📜 HISTÓRICO DE MENSAGENS</h3>
        <button class="close-history" id="closeHistory">✕</button>
    </div>
    <div class="history-list" id="historyList">
        <div class="history-item">Nenhuma mensagem ainda</div>
    </div>
    <button id="clearHistoryBtn" style="margin-top: 10px; background: #ff4444;">🗑️ LIMPAR HISTÓRICO</button>
</div>

<div class="assistant-card">
    <div class="header">
        <h1>🤖 JA ASSISTENTE MEGA</h1>
        <p>🎤 Ativação por voz | Diga "JA" + comando | 200+ COMANDOS!</p>
        <div class="history-toggle" id="historyToggle">📜 HISTÓRICO</div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="message bot-message">
            <div class="avatar">JA</div>
            <div class="bubble">Olá! Sou a JA MEGA, sua assistente pessoal. Tenho mais de 200 comandos! Fale "JA" e depois o comando! 🎤</div>
        </div>
    </div>

    <div class="controls">
        <button id="micBtn">🎤 MICROFONE</button>
        <button id="clearChatBtn">🗑️ LIMPAR CHAT</button>
        <button id="helpBtn">❓ COMANDOS</button>
        <button id="whatsappBtn">📱 WHATSAPP</button>
    </div>
    <div class="status" id="statusMsg">⚡ Aguardando ativação...</div>
</div>

<script>
    // Partículas
    const canvas = document.getElementById('particlesCanvas');
    const ctxParticles = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 1;
            this.speedY = (Math.random() - 0.5) * 1;
            this.color = `hsl(${Math.random() * 60 + 200}, 70%, 60%)`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
        }
        draw() {
            ctxParticles.beginPath();
            ctxParticles.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctxParticles.fillStyle = this.color;
            ctxParticles.shadowBlur = 8;
            ctxParticles.shadowColor = '#667eea';
            ctxParticles.fill();
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < 100; i++) particles.push(new Particle());
    }
    function animateParticles() {
        ctxParticles.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
    resizeCanvas(); initParticles(); animateParticles();

    // Assistente
    const chatArea = document.getElementById('chatArea');
    const statusSpan = document.getElementById('statusMsg');
    const micBtn = document.getElementById('micBtn');
    const clearChatBtn = document.getElementById('clearChatBtn');
    const helpBtn = document.getElementById('helpBtn');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const historyToggle = document.getElementById('historyToggle');
    const historyPanel = document.getElementById('historyPanel');
    const closeHistory = document.getElementById('closeHistory');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    let recognition = null;
    let aguardandoCidade = false;
    let aguardandoWhatsApp = false;
    let aguardandoLembrete = false;
    let aguardandoTraducao = false;
    let aguardandoSignificado = false;
    let aguardandoReceita = false;
    let aguardandoCotacaoMoeda = false;
    let aguardandoQuiz = false;
    let aguardandoQuizResposta = null;
    let aguardandoForca = false;
    let forcaPalavra = "";
    let forcaTentativas = [];
    let modoConcentracao = false;
    let score = 0;
    let jogoAdivinhacao = null;
    let minhaIdade = localStorage.getItem('ja_idade') || null;
    let pomodoroAtivo = false;
    
    let historicoMensagens = JSON.parse(localStorage.getItem('ja_historico')) || [];
    let tarefas = JSON.parse(localStorage.getItem('ja_tarefas')) || [];
    let anotacoes = JSON.parse(localStorage.getItem('ja_anotacoes')) || [];
    let eventos = JSON.parse(localStorage.getItem('ja_eventos')) || [];
    let habitos = JSON.parse(localStorage.getItem('ja_habitos')) || [];
    let metas = JSON.parse(localStorage.getItem('ja_metas')) || [];
    let checklist = JSON.parse(localStorage.getItem('ja_checklist')) || [];

    function salvarHistorico() {
        localStorage.setItem('ja_historico', JSON.stringify(historicoMensagens));
        atualizarHistoricoUI();
    }

    function adicionarHistorico(texto, tipo) {
        historicoMensagens.unshift({
            texto: texto,
            tipo: tipo,
            data: new Date().toLocaleString()
        });
        if (historicoMensagens.length > 50) historicoMensagens.pop();
        salvarHistorico();
    }

    function atualizarHistoricoUI() {
        if (historicoMensagens.length === 0) {
            historyList.innerHTML = '<div class="history-item">Nenhuma mensagem ainda</div>';
            return;
        }
        historyList.innerHTML = historicoMensagens.map(msg => `
            <div class="history-item">
                <div class="time">${msg.data}</div>
                <div><strong>${msg.tipo === 'user' ? 'VOCÊ' : 'JA'}:</strong> ${msg.texto.substring(0, 100)}</div>
            </div>
        `).join('');
    }

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;
    } else {
        statusSpan.innerText = "❌ Use Chrome/Edge para voz";
        micBtn.disabled = true;
    }

    function falar(texto) {
        if (modoConcentracao && texto.length > 100) {
            texto = "Modo concentração ativo. " + texto.substring(0, 80);
        }
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.95;
        utterance.pitch = 1;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        addMessage(texto, false);
        adicionarHistorico(texto, 'bot');
    }

    function addMessage(texto, isUser = true) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
        msgDiv.innerHTML = `
            <div class="avatar">${isUser ? 'VOCÊ' : 'JA'}</div>
            <div class="bubble">${texto}</div>
        `;
        chatArea.appendChild(msgDiv);
        msgDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
        if (isUser) adicionarHistorico(texto, 'user');
    }

    function abrirWhatsApp(contato, mensagem) {
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const numero = contato.replace(/\D/g, '');
        
        if (isMobile) {
            if (numero) {
                window.open(`https://wa.me/55${numero}?text=${encodeURIComponent(mensagem)}`, '_blank');
                falar(`Abrindo WhatsApp para ${contato}`);
            } else {
                window.location.href = "whatsapp://";
                falar("Abrindo WhatsApp");
            }
        } else {
            window.open("https://web.whatsapp.com", "_blank");
            falar("Abrindo WhatsApp Web");
        }
    }

    function processarComando(comando) {
        comando = comando.toLowerCase().trim();
        
        // Aguardando respostas
        if (aguardandoCidade) {
            aguardandoCidade = false;
            fetch(`https://wttr.in/${encodeURIComponent(comando)}?format=%C+%t+%w&lang=pt`)
                .then(res => res.text())
                .then(clima => {
                    if (clima.includes("Unknown")) falar(`Não encontrei a cidade ${comando}`);
                    else falar(`Clima em ${comando}: ${clima}`);
                })
                .catch(() => falar("Erro ao buscar clima"));
            statusSpan.innerText = "⚡ Aguardando ativação...";
            return;
        }
        
        if (aguardandoWhatsApp) {
            aguardandoWhatsApp = false;
            const partes = comando.split(' para ');
            if (partes.length === 2) {
                const mensagem = partes[0];
                const contato = partes[1];
                abrirWhatsApp(contato, mensagem);
            } else {
                falar("Comando inválido. Diga: mensagem para contato");
            }
            return;
        }
        
        if (aguardandoLembrete) {
            aguardandoLembrete = false;
            const lembretes = JSON.parse(localStorage.getItem('ja_lembretes') || '[]');
            lembretes.push({ texto: comando, data: new Date().toLocaleString() });
            localStorage.setItem('ja_lembretes', JSON.stringify(lembretes));
            falar(`Lembrete adicionado: ${comando}`);
            return;
        }
        
        if (aguardandoTraducao) {
            aguardandoTraducao = false;
            fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(comando)}&langpair=en|pt`)
                .then(res => res.json())
                .then(data => {
                    falar(`Tradução: ${data.responseData.translatedText}`);
                })
                .catch(() => falar("Erro na tradução"));
            return;
        }
        
        if (aguardandoSignificado) {
            aguardandoSignificado = false;
            const palavra = comando;
            if (palavra) {
                fetch(`https://api.dicionario-aberto.net/word/${encodeURIComponent(palavra)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.length > 0) {
                            let significado = data[0].xml?.replace(/<[^>]*>/g, '').substring(0, 300) || "Significado não encontrado";
                            falar(`${palavra}: ${significado}`);
                        } else falar(`Não encontrei significado para ${palavra}`);
                    })
                    .catch(() => falar("Erro ao buscar significado"));
            }
            return;
        }
        
        if (aguardandoReceita) {
            aguardandoReceita = false;
            const prato = comando;
            if (prato) {
                fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(prato)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.meals) {
                            falar(`Receita de ${prato}: ${data.meals[0].strInstructions.substring(0, 300)}`);
                        } else falar(`Não encontrei receita para ${prato}`);
                    })
                    .catch(() => falar("Erro ao buscar receita"));
            }
            return;
        }
        
        if (aguardandoCotacaoMoeda) {
            aguardandoCotacaoMoeda = false;
            const moeda = comando.toUpperCase();
            fetch(`https://economia.awesomeapi.com.br/json/last/${moeda}-BRL`)
                .then(res => res.json())
                .then(data => {
                    if (data[`${moeda}BRL`]) {
                        falar(`1 ${moeda} = R$ ${parseFloat(data[`${moeda}BRL`].bid).toFixed(2)}`);
                    } else falar(`Moeda ${moeda} não encontrada`);
                })
                .catch(() => falar("Erro ao buscar cotação"));
            return;
        }
        
        if (aguardandoQuiz && aguardandoQuizResposta) {
            if (comando === aguardandoQuizResposta.resposta) {
                falar("Parabéns! Você acertou!");
                score++;
            } else {
                falar(`Que pena! A resposta correta era ${aguardandoQuizResposta.resposta}.`);
            }
            aguardandoQuiz = false;
            aguardandoQuizResposta = null;
            return;
        }
        
        if (aguardandoForca) {
            if (comando.length === 1) {
                let acertou = false;
                for(let i = 0; i < forcaPalavra.length; i++) {
                    if (forcaPalavra[i] === comando) {
                        forcaTentativas[i] = comando;
                        acertou = true;
                    }
                }
                if (!acertou && !forcaTentativas.includes(comando)) {
                    forcaTentativas.push(comando);
                }
                let exibicao = forcaTentativas.map((l, i) => l ? l : '_').join(' ');
                if (!exibicao.includes('_')) {
                    falar(`Parabéns! Você acertou a palavra: ${forcaPalavra}`);
                    aguardandoForca = false;
                } else {
                    falar(`Palavra: ${exibicao}. Tentativas: ${forcaTentativas.filter(l => l && l.length === 1).join(', ')}`);
                }
            }
            return;
        }
        
        let cmd = comando;
        let ativado = false;
        const ativadores = ["ja", "já", "jotta", "jota", "assistente", "robô", "robo", "hey", "mega"];
        for (let a of ativadores) {
            if (cmd.startsWith(a)) {
                cmd = cmd.replace(a, "").trim();
                ativado = true;
                break;
            }
        }
        
        if (!ativado && cmd.length > 0) {
            const primeira = cmd.split(' ')[0];
            if (primeira && (primeira.startsWith('j') || primeira.startsWith('y') || primeira.startsWith('i'))) {
                cmd = cmd.substring(primeira.length).trim();
                ativado = true;
            }
        }
        
        if (!ativado && cmd !== "") {
            return;
        }
        if (cmd === "") {
            falar("Diga um comando após JA");
            return;
        }
        
        // ========== COMANDOS BÁSICOS ==========
        
        // WhatsApp
        if (cmd.includes("abrir whatsapp") || (cmd.includes("whatsapp") && !cmd.includes("para"))) {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            if (isMobile) window.location.href = "whatsapp://";
            else window.open("https://web.whatsapp.com", "_blank");
            falar("Abrindo WhatsApp");
            return;
        }
        
        else if (cmd.includes("mensagem") || cmd.includes("zap") || cmd.includes("mandar") || cmd.includes("para")) {
            if (cmd.includes("para")) {
                const partes = cmd.split("para");
                let mensagem = partes[0].replace("mandar", "").replace("mensagem", "").replace("whatsapp", "").replace("zap", "").trim();
                let contato = partes[1].trim();
                if (mensagem === "") mensagem = "Olá!";
                window.open(`https://web.whatsapp.com`, "_blank");
                navigator.clipboard.writeText(mensagem);
                falar(`Mensagem copiada! Cole no WhatsApp para ${contato}`);
                return;
            }
            falar("Diga: mensagem para contato");
            aguardandoWhatsApp = true;
            return;
        }
        
        // ========== 1. TEMPO E DATA ==========
        else if (cmd.includes("que horas são") || cmd.includes("horas")) { falar(`São ${new Date().toLocaleTimeString('pt-BR')}`); return; }
        else if (cmd.includes("data") || cmd.includes("hoje é")) { falar(`Hoje é ${new Date().toLocaleDateString('pt-BR')}`); return; }
        else if (cmd.includes("dias para o natal")) { let hoje = new Date(); let natal = new Date(hoje.getFullYear(), 11, 25); if (hoje > natal) natal = new Date(hoje.getFullYear() + 1, 11, 25); falar(`Faltam ${Math.ceil((natal - hoje) / 86400000)} dias para o Natal!`); return; }
        else if (cmd.includes("dias úteis")) { falar("Função: conta dias úteis entre datas"); return; }
        else if (cmd.includes("próximo fim de semana")) { let hoje = new Date(); let diasFDS = (6 - hoje.getDay() + 7) % 7; falar(`Próximo fim de semana começa em ${diasFDS} dias`); return; }
        else if (cmd.includes("semana do ano")) { let hoje = new Date(); let inicio = new Date(hoje.getFullYear(), 0, 1); let semana = Math.ceil(((hoje - inicio) / 86400000 + inicio.getDay() + 1) / 7); falar(`Estamos na semana ${semana} do ano`); return; }
        else if (cmd.includes("dia da semana de")) { let data = cmd.match(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/)?.[0]; if (data) { let dias = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"]; let d = new Date(data.split('/').reverse().join('-')); falar(`${data} cai em ${dias[d.getDay()]}`); } return; }
        else if (cmd.includes("idade em dias")) { let data = cmd.match(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/)?.[0]; if (data) { let nascimento = new Date(data.split('/').reverse().join('-')); let idadeDias = Math.floor((new Date() - nascimento) / 86400000); falar(`Idade em dias: ${idadeDias}`); } return; }
        else if (cmd.includes("horário em")) { let cidade = cmd.replace("horário em", "").trim(); falar(`Horário em ${cidade}: ${new Date().toLocaleString()}`); return; }
        else if (cmd.includes("estação do ano")) { let mes = new Date().getMonth(); let estacao = mes < 3 ? "Verão" : mes < 6 ? "Outono" : mes < 9 ? "Inverno" : "Primavera"; falar(`Estamos no ${estacao}`); return; }

        else if (cmd.includes("população de")) { let local = cmd.replace("população de", "").trim(); const pops = { brasil: "214 milhões", "são paulo": "12,4 milhões" }; falar(`População de ${local}: ${pops[local.toLowerCase()] || "não disponível"}`); return; }
        else if (cmd.includes("maior do mundo")) { if (cmd.includes("montanha")) falar("Monte Everest - 8.848m"); else if (cmd.includes("rio")) falar("Rio Amazonas - 7.000km"); else falar("Diga: montanha, rio, deserto, oceano"); return; }
        else if (cmd.includes("criador do") || cmd.includes("inventor do")) { let coisa = cmd.replace("criador do", "").replace("inventor do", "").trim(); const criadores = { computador: "Charles Babbage", python: "Guido van Rossum", javascript: "Brendan Eich" }; falar(`Criador do ${coisa}: ${criadores[coisa] || "não sei"}`); return; }
        else if (cmd.includes("em que ano foi")) { let evento = cmd.replace("em que ano foi", "").trim(); const anos = { "independência do brasil": "1822", "descobrimento do brasil": "1500" }; falar(`${evento}: ${anos[evento] || "não sei"}`); return; }
        else if (cmd.includes("código do país") || cmd.includes("ddi")) { let pais = cmd.match(/código do\s+(\w+)/)?.[1]; const codigos = { brasil: "+55", eua: "+1", inglaterra: "+44" }; falar(`Código do ${pais}: ${codigos[pais] || "não sei"}`); return; }
        else if (cmd.includes("moeda do") || cmd.includes("moeda da")) { let pais = cmd.replace("moeda do", "").replace("moeda da", "").trim(); const moedas = { brasil: "Real (BRL)", eua: "Dólar (USD)" }; falar(`Moeda do ${pais}: ${moedas[pais] || "não sei"}`); return; }
        else if (cmd.includes("horóscopo") || cmd.includes("horoscopo")) { const signos = ["áries", "touro", "gêmeos", "câncer", "leão", "virgem", "libra", "escorpião", "sagitário", "capricórnio", "aquário", "peixes"]; let signo = signos.find(s => cmd.includes(s)); if (signo) falar(`${signo}: Hoje é um dia de novas oportunidades!`); else falar("Diga seu signo. Ex: horóscopo de leão"); return; }
        else if (cmd.includes("idade de quem nasceu em")) { let ano = parseInt(cmd.match(/\d{4}/)?.[0]); if (ano) falar(`Quem nasceu em ${ano} tem ${new Date().getFullYear() - ano} anos`); return; }
        else if (cmd.includes("minha idade")) { if (minhaIdade) falar(`Sua idade é ${minhaIdade} anos`); else falar("Diga 'minha idade é X' primeiro"); return; }
        else if (cmd.includes("minha idade é")) { let idade = parseInt(cmd.match(/\d+/)?.[0]); if (idade) { minhaIdade = idade; localStorage.setItem('ja_idade', idade); falar(`Idade salva: ${idade} anos`); } return; }
        
        // ========== 11. UTILIDADES ==========
        else if (cmd.includes("traduzir") || cmd.includes("traduza")) { falar("Diga a palavra/frase em inglês"); aguardandoTraducao = true; return; }
        else if (cmd.includes("bateria") || cmd.includes("energia")) { if (navigator.getBattery) { navigator.getBattery().then(b => falar(`Bateria: ${Math.round(b.level * 100)}%`)); } else falar("Navegador não suporta"); return; }
        else if (cmd.includes("cronômetro") || (cmd.includes("timer") && !cmd.includes("timer de"))) { let segundos = parseInt(cmd.match(/\d+/)?.[0]) || 10; falar(`Contagem de ${segundos}s`); for(let i = segundos; i > 0; i--) setTimeout(() => { if(i === 5 || i === 3 || i === 1) falar(`${i}`); }, (segundos - i) * 1000); setTimeout(() => falar("Tempo esgotado!"), segundos * 1000); return; }
        else if (cmd.includes("timer de")) { let minutos = parseInt(cmd.match(/\d+/)?.[0]) || 1; falar(`Timer de ${minutos} minutos iniciado`); setTimeout(() => falar(`Tempo esgotado! ${minutos} minutos`), minutos * 60000); return; }
        else if (cmd.includes("cotação do dólar") || cmd.includes("cotação do euro")) { fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL").then(res => res.json()).then(data => { falar(`Dólar: R$ ${parseFloat(data.USDBRL.bid).toFixed(2)}, Euro: R$ ${parseFloat(data.EURBRL.bid).toFixed(2)}`); }).catch(() => falar("Erro")); return; }
        else if (cmd.includes("cotação de")) { let moeda = cmd.match(/cotação de\s+(\w+)/)?.[1]; if (moeda) { aguardandoCotacaoMoeda = true; falar(`Buscando cotação de ${moeda}...`); setTimeout(() => { if(aguardandoCotacaoMoeda) { aguardandoCotacaoMoeda = false; fetch(`https://economia.awesomeapi.com.br/json/last/${moeda.toUpperCase()}-BRL`).then(res => res.json()).then(data => { if(data[`${moeda.toUpperCase()}BRL`]) falar(`1 ${moeda.toUpperCase()} = R$ ${parseFloat(data[`${moeda.toUpperCase()}BRL`].bid).toFixed(2)}`); else falar("Moeda não encontrada"); }).catch(() => falar("Erro")); } }, 100); } return; }
        else if (cmd.includes("cep")) { let cep = cmd.match(/\d{5}-?\d{3}/)?.[0]; if (cep) { fetch(`https://viacep.com.br/ws/${cep.replace("-", "")}/json/`).then(res => res.json()).then(data => { if(data.erro) falar("CEP não encontrado"); else falar(`${data.logradouro}, ${data.bairro}, ${data.localidade} - ${data.uf}`); }).catch(() => falar("Erro")); } else falar("Diga um CEP com 8 números"); return; }
        
        // ========== 12. PESQUISA E NAVEGAÇÃO ==========
        else if (cmd.includes("pesquisar") || cmd.includes("buscar")) { let busca = cmd.replace("pesquisar", "").replace("buscar", "").trim(); if (busca) { window.open(`https://google.com/search?q=${encodeURIComponent(busca)}`, "_blank"); falar(`Pesquisando ${busca}`); } else falar("O que quer pesquisar?"); return; }
        else if (cmd.includes("youtube")) { window.open("https://youtube.com", "_blank"); falar("Abrindo YouTube"); return; }
        else if (cmd.includes("google")) { window.open("https://google.com", "_blank"); falar("Abrindo Google"); return; }
        else if (cmd.includes("spotify")) { window.open("https://open.spotify.com", "_blank"); falar("Abrindo Spotify"); return; }
        else if (cmd.includes("netflix")) { window.open("https://netflix.com", "_blank"); falar("Abrindo Netflix"); return; }
        
        // ========== 13. ROLAGEM E FALA ==========
        else if (cmd.includes("rolar para baixo")) { window.scrollBy(0, 400); falar("Rolando para baixo"); return; }
        else if (cmd.includes("rolar para cima")) { window.scrollBy(0, -400); falar("Rolando para cima"); return; }
        else if (cmd.includes("fale")) { let texto = cmd.replace("fale", "").trim(); if (texto) falar(texto); else falar("Diga o que devo falar"); return; }
        
        // ========== 14. SAUDAÇÕES ==========
        else if (cmd.includes("olá") || cmd.includes("ola")) { falar("Olá! Como posso ajudar?"); return; }
        else if (cmd.includes("bom dia")) { falar("Bom dia! Tenha um excelente dia!"); return; }
        else if (cmd.includes("boa tarde")) { falar("Boa tarde! Como posso auxiliar?"); return; }
        else if (cmd.includes("boa noite")) { falar("Boa noite! Descanse bem."); return; }
        else if (cmd.includes("obrigado") || cmd.includes("obrigada")) { falar("De nada!"); return; }
        else if (cmd.includes("tchau") || cmd.includes("adeus")) { falar("Até logo!"); return; }
        else if (cmd.includes("quem te criou") || cmd.includes("criador")) { falar("Fui criada pelo João Altafini!"); return; }
        else if (cmd.includes("como você está")) { falar("Estou online e funcionando! Pronta para ajudar."); return; }
        
        // ========== 15. PONTUAÇÃO ==========
        else if (cmd.includes("adicionar ponto") || cmd.includes("mais um ponto")) { score++; falar(`Você tem ${score} pontos!`); return; }
        else if (cmd.includes("resetar pontuação")) { score = 0; falar("Pontuação zerada!"); return; }
        else if (cmd.includes("minha pontuação") || cmd.includes("quantos pontos")) { falar(`Você tem ${score} pontos`); return; }
        
        // ========== 16. MODO CONCENTRAÇÃO ==========
        else if (cmd.includes("modo concentração") || cmd.includes("modo foco")) { modoConcentracao = true; falar("Modo concentração ativado por 30 minutos"); setTimeout(() => { modoConcentracao = false; falar("Modo concentração desativado"); }, 30 * 60000); return; }
        else if (cmd.includes("desativar modo concentração")) { modoConcentracao = false; falar("Modo concentração desativado"); return; }
        
        // ========== 17. ENTRETENIMENTO EXTRA ==========
        else if (cmd.includes("série favorita")) { const series = ["Stranger Things", "The Crown", "Black Mirror"]; falar(`Recomendo: ${series[Math.floor(Math.random() * series.length)]}`); return; }
        else if (cmd.includes("filme aleatório")) { const filmes = ["Matrix", "Interestelar", "Inception"]; falar(`Assista: ${filmes[Math.floor(Math.random() * filmes.length)]}`); return; }
        else if (cmd.includes("livro recomendado")) { const livros = ["O Hobbit - Tolkien", "1984 - George Orwell"]; falar(`Recomendo: ${livros[Math.floor(Math.random() * livros.length)]}`); return; }
        else if (cmd.includes("podcast")) { const podcasts = ["Hipsters Ponto Tech", "NerdCast"]; falar(`Podcast: ${podcasts[Math.floor(Math.random() * podcasts.length)]}`); return; }
        else if (cmd.includes("enigma") || cmd.includes("quebra-cabeça")) { const enigmas = ["O que é, o que é: quanto mais se tira, maior fica? (Buraco)"]; falar(enigmas[Math.floor(Math.random() * enigmas.length)]); return; }
        
        // ========== 18. AJUDA ==========
        else if (cmd.includes("ajuda") || cmd.includes("comandos")) {
            falar("Comandos: hora, data, clima, calcular, dado, cara ou coroa, piada, curiosidade, pesquisar, traduzir, bateria, cronômetro, timer, cotação, cep, tabuada, par ou ímpar, pontuação, motivação, lista de tarefas, anotações, dicionário, receitas, número da sorte, idade, conversão, horóscopo, pedra papel tesoura, adivinhação, eventos, fatos aleatórios, raiz quadrada, porcentagem, potência, média, fatorial, primo, MDC, MMC, gerar senha, força da senha, inverter texto, palíndromo, IMC, dias para o Natal, palavra aleatória, rima, anagrama, capital, população, maior do mundo, criador, em que ano foi, código do país, moeda, signo, maiúsculo, minúsculo, trocar palavras, frase aleatória, dica de estudo, número romano, dica de saúde, hábitos, metas, peso ideal, calorias, água diária, série favorita, filme aleatório, livro recomendado, podcast.");
            return;
        }
        
        // Fallback
        else {
            falar("Não entendi. Diga 'JA ajuda' para comandos");
        }
    }
    
    if (recognition) {
        recognition.onstart = () => {
            statusSpan.innerText = "🎤 Ouvindo... Fale o comando";
            micBtn.classList.add('mic-active');
        };
        recognition.onend = () => {
            micBtn.classList.remove('mic-active');
            statusSpan.innerText = "⚡ Aguardando ativação...";
        };
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            addMessage(transcript, true);
            processarComando(transcript);
        };
        recognition.onerror = () => {
            statusSpan.innerText = "❌ Erro no microfone";
            micBtn.classList.remove('mic-active');
        };
    }
    
    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        try { recognition.start(); } 
        catch(e) { statusSpan.innerText = "Já está ouvindo"; }
    });
    
    clearChatBtn.addEventListener('click', () => {
        while (chatArea.children.length > 2) {
            chatArea.removeChild(chatArea.lastChild);
        }
        falar("Chat limpo!");
    });
    
    helpBtn.addEventListener('click', () => {
        falar("Comandos: hora, data, clima, calcular, dado, cara ou coroa, piada, curiosidade, pesquisar, abrir youtube/google/spotify/netflix, rolar, fale, raiz quadrada, porcentagem, potência, média, fatorial, primo, MDC, MMC, gerar senha, inverter, palíndromo, IMC, dias para o Natal, palavra aleatória, capital do, população, quiz, jogar forca, pomodoro, calma, meditação, alongamento, curiosidade do dia, pensamento do dia, sabia que, lista de tarefas, anotações, eventos, hábitos, metas, checklist, cotação, cep, tabuada, par ou ímpar, pontuação, motivação, traduzir, bateria, cronômetro, timer, dicionário, receitas, número da sorte, idade, conversão, horóscopo, pedra papel tesoura, adivinhação.");
    });
    
    whatsappBtn.addEventListener('click', () => {
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) window.location.href = "whatsapp://";
        else window.open("https://web.whatsapp.com", "_blank");
        falar("Abrindo WhatsApp");
    });
    
    historyToggle.addEventListener('click', () => {
        historyPanel.classList.add('open');
    });
    
    closeHistory.addEventListener('click', () => {
        historyPanel.classList.remove('open');
    });
    
    clearHistoryBtn.addEventListener('click', () => {
        historicoMensagens = [];
        salvarHistorico();
        falar("Histórico limpo!");
    });
    
    atualizarHistoricoUI();
    
    setTimeout(() => {
        falar("Assistente JA MEGA ativada! Tenho mais de 200 comandos! Fale JA ajuda para conhecer todos!");
    }, 500);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
