<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>JA Assistente Virtual - IA Pessoal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Outfit', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Efeito de partículas */
        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .assistant-card {
            max-width: 800px;
            width: 100%;
            background: rgba(10, 20, 40, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .header p {
            color: #e0f0ff;
            margin-top: 6px;
        }

        /* Histórico */
        .history-toggle {
            position: absolute;
            right: 20px;
            top: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.8rem;
            z-index: 10;
        }

        .history-panel {
            position: fixed;
            right: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: rgba(10, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 255, 255, 0.3);
            transition: right 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .history-panel.open {
            right: 0;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
        }

        .history-header h3 {
            color: #FFD700;
        }

        .close-history {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #ccc;
        }

        .history-item .time {
            color: #FFD700;
            font-size: 0.7rem;
        }

        .chat-area {
            height: 380px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(5, 10, 25, 0.5);
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            flex-direction: row-reverse;
        }

        .user-message .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 24px 24px 4px 24px;
        }

        .bot-message .bubble {
            background: rgba(20, 30, 55, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #e2f0ff;
            border-radius: 24px 24px 24px 4px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user-message .avatar {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 18px;
            font-size: 0.95rem;
            line-height: 1.45;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px #667eea;
        }

        .status {
            font-size: 0.75rem;
            text-align: center;
            padding: 10px;
            color: #88aaff;
            border-top: 1px solid rgba(0,255,255,0.2);
        }

        .mic-active {
            animation: pulseMic 1s infinite;
        }

        @keyframes pulseMic {
            0% { box-shadow: 0 0 0 0 #d4ff00; }
            100% { box-shadow: 0 0 0 10px rgba(212,255,0,0); }
        }

        @media (max-width: 550px) {
            .assistant-card { margin: 10px; }
            .bubble { max-width: 85%; font-size: 0.85rem; }
            button { padding: 8px 16px; font-size: 0.75rem; }
            .history-panel { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

<canvas id="particlesCanvas"></canvas>

<!-- Painel de Histórico -->
<div class="history-panel" id="historyPanel">
    <div class="history-header">
        <h3>📜 HISTÓRICO DE MENSAGENS</h3>
        <button class="close-history" id="closeHistory">✕</button>
    </div>
    <div class="history-list" id="historyList">
        <div class="history-item">Nenhuma mensagem ainda</div>
    </div>
    <button id="clearHistoryBtn" style="margin-top: 10px; background: #ff4444;">🗑️ LIMPAR HISTÓRICO</button>
</div>

<div class="assistant-card">
    <div class="header">
        <h1>🤖 JA ASSISTENTE</h1>
        <p>🎤 Ativação por voz | Diga "JA" + comando</p>
        <div class="history-toggle" id="historyToggle">📜 HISTÓRICO</div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="message bot-message">
            <div class="avatar">JA</div>
            <div class="bubble">Olá! Sou a JA, sua assistente pessoal. Fale "JA" e depois o comando, ou use os botões abaixo. 🎤</div>
        </div>
    </div>

    <div class="controls">
        <button id="micBtn">🎤 MICROFONE</button>
        <button id="clearChatBtn">🗑️ LIMPAR CHAT</button>
        <button id="helpBtn">❓ COMANDOS</button>
        <button id="whatsappBtn">📱 WHATSAPP</button>
    </div>
    <div class="status" id="statusMsg">⚡ Aguardando ativação...</div>
</div>

<script>
    // ==================== PARTÍCULAS ====================
    const canvas = document.getElementById('particlesCanvas');
    const ctxParticles = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 1;
            this.speedY = (Math.random() - 0.5) * 1;
            this.color = `hsl(${Math.random() * 60 + 200}, 70%, 60%)`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
        }
        draw() {
            ctxParticles.beginPath();
            ctxParticles.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctxParticles.fillStyle = this.color;
            ctxParticles.shadowBlur = 8;
            ctxParticles.shadowColor = '#667eea';
            ctxParticles.fill();
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < 100; i++) particles.push(new Particle());
    }
    function animateParticles() {
        ctxParticles.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
    resizeCanvas(); initParticles(); animateParticles();

    // ==================== ASSISTENTE ====================
    const chatArea = document.getElementById('chatArea');
    const statusSpan = document.getElementById('statusMsg');
    const micBtn = document.getElementById('micBtn');
    const clearChatBtn = document.getElementById('clearChatBtn');
    const helpBtn = document.getElementById('helpBtn');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const historyToggle = document.getElementById('historyToggle');
    const historyPanel = document.getElementById('historyPanel');
    const closeHistory = document.getElementById('closeHistory');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    let recognition = null;
    let aguardandoCidade = false;
    let aguardandoWhatsApp = false;
    let aguardandoLembrete = false;
    
    // Histórico
    let historicoMensagens = JSON.parse(localStorage.getItem('ja_historico')) || [];

    function salvarHistorico() {
        localStorage.setItem('ja_historico', JSON.stringify(historicoMensagens));
        atualizarHistoricoUI();
    }

    function adicionarHistorico(texto, tipo) {
        historicoMensagens.unshift({
            texto: texto,
            tipo: tipo,
            data: new Date().toLocaleString()
        });
        if (historicoMensagens.length > 50) historicoMensagens.pop();
        salvarHistorico();
    }

    function atualizarHistoricoUI() {
        if (historicoMensagens.length === 0) {
            historyList.innerHTML = '<div class="history-item">Nenhuma mensagem ainda</div>';
            return;
        }
        historyList.innerHTML = historicoMensagens.map(msg => `
            <div class="history-item">
                <div class="time">${msg.data}</div>
                <div><strong>${msg.tipo === 'user' ? 'VOCÊ' : 'JA'}:</strong> ${msg.texto.substring(0, 100)}</div>
            </div>
        `).join('');
    }

    // Suporte Web Speech
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;
    } else {
        statusSpan.innerText = "❌ Use Chrome/Edge para voz";
        micBtn.disabled = true;
    }

    function falar(texto) {
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.95;
        utterance.pitch = 1;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        addMessage(texto, false);
        adicionarHistorico(texto, 'bot');
    }

    function addMessage(texto, isUser = true) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
        msgDiv.innerHTML = `
            <div class="avatar">${isUser ? 'VOCÊ' : 'JA'}</div>
            <div class="bubble">${texto}</div>
        `;
        chatArea.appendChild(msgDiv);
        msgDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
        if (isUser) adicionarHistorico(texto, 'user');
    }

    function abrirWhatsApp(contato, mensagem) {
        // Tenta abrir WhatsApp Web
        const numero = contato.replace(/\D/g, '');
        if (numero) {
            window.open(`https://wa.me/55${numero}?text=${encodeURIComponent(mensagem)}`, '_blank');
            falar(`Abrindo WhatsApp para o número ${contato}`);
        } else {
            falar("Não consegui identificar o número");
        }
    }

    function processarComando(comando) {
        comando = comando.toLowerCase().trim();
        
        // Aguardando respostas de perguntas
        if (aguardandoCidade) {
            aguardandoCidade = false;
            fetch(`https://wttr.in/${encodeURIComponent(comando)}?format=%C+%t+%w&lang=pt`)
                .then(res => res.text())
                .then(clima => {
                    if (clima.includes("Unknown")) falar(`Não encontrei a cidade ${comando}`);
                    else falar(`Clima em ${comando}: ${clima}`);
                })
                .catch(() => falar("Erro ao buscar clima"));
            statusSpan.innerText = "⚡ Aguardando ativação...";
            return;
        }
        
        if (aguardandoWhatsApp) {
            aguardandoWhatsApp = false;
            const partes = comando.split(' para ');
            if (partes.length === 2) {
                const mensagem = partes[0];
                const contato = partes[1];
                abrirWhatsApp(contato, mensagem);
            } else {
                falar("Comando inválido. Diga: mensagem para contato");
            }
            return;
        }
        
        if (aguardandoLembrete) {
            aguardandoLembrete = false;
            const lembretes = JSON.parse(localStorage.getItem('ja_lembretes') || '[]');
            lembretes.push({ texto: comando, data: new Date().toLocaleString() });
            localStorage.setItem('ja_lembretes', JSON.stringify(lembretes));
            falar(`Lembrete adicionado: ${comando}`);
            return;
        }
        
        // Ativação
        let cmd = comando;
        let ativado = false;
        const ativadores = ["ja", "já", "jotta", "jota", "assistente", "robô", "robo", "hey"];
        for (let a of ativadores) {
            if (cmd.startsWith(a)) {
                cmd = cmd.replace(a, "").trim();
                ativado = true;
                break;
            }
        }
        
        if (!ativado && cmd.length > 0) {
            const primeira = cmd.split(' ')[0];
            if (primeira && (primeira.startsWith('j') || primeira.startsWith('y') || primeira.startsWith('i'))) {
                cmd = cmd.substring(primeira.length).trim();
                ativado = true;
            }
        }
        
        if (!ativado && cmd !== "") {
            return;
        }
        if (cmd === "") {
            falar("Diga um comando após JA");
            return;
        }
        
        // ========== COMANDOS EXPANDIDOS ==========
        
        // WhatsApp
        if (cmd.includes("whatsapp") || cmd.includes("mensagem") || cmd.includes("zap")) {
            falar("Fale a mensagem e depois 'para' e o contato. Exemplo: Oi tudo bem para Maria");
            aguardandoWhatsApp = true;
            statusSpan.innerText = "📱 Diga: mensagem para contato";
            return;
        }
        
        // Lembretes
        else if (cmd.includes("lembrar") || cmd.includes("lembrete")) {
            falar("Diga o lembrete que deseja adicionar");
            aguardandoLembrete = true;
            statusSpan.innerText = "📝 Diga seu lembrete...";
            return;
        }
        else if (cmd.includes("meus lembretes") || cmd.includes("listar lembretes")) {
            const lembretes = JSON.parse(localStorage.getItem('ja_lembretes') || '[]');
            if (lembretes.length === 0) falar("Você não tem lembretes");
            else {
                const lista = lembretes.map(l => l.texto).join(", ");
                falar(`Seus lembretes: ${lista}`);
            }
            return;
        }
        else if (cmd.includes("apagar lembretes")) {
            localStorage.removeItem('ja_lembretes');
            falar("Todos os lembretes foram apagados");
            return;
        }
        
        // Clima
        else if (cmd.includes("clima") || cmd.includes("tempo")) {
            falar("Diga o nome da cidade");
            aguardandoCidade = true;
            statusSpan.innerText = "🌡️ Diga o nome da cidade...";
            return;
        }
        
        // Música (YouTube Music)
        else if (cmd.includes("tocar música") || cmd.includes("tocar") && cmd.includes("musica")) {
            let musica = cmd.replace("tocar música", "").replace("tocar", "").trim();
            if (musica === "") falar("Diga o nome da música");
            else {
                window.open(`https://music.youtube.com/search?q=${encodeURIComponent(musica)}`, "_blank");
                falar(`Tocando ${musica} no YouTube Music`);
            }
            return;
        }
        
        // Calculadora
        else if (cmd.includes("calcular")) {
            let expressao = cmd.replace("calcular", "").trim();
            try {
                let resultado = eval(expressao);
                falar(`O resultado de ${expressao} é ${resultado}`);
            } catch(e) {
                falar("Não consegui calcular essa expressão");
            }
            return;
        }
        
        // Moedas (cara ou coroa)
        else if (cmd.includes("cara ou coroa")) {
            const resultado = Math.random() < 0.5 ? "cara" : "coroa";
            falar(`Deu ${resultado}`);
            return;
        }
        
        // Jogar dado
        else if (cmd.includes("dado") || cmd.includes("jogar dado")) {
            const numero = Math.floor(Math.random() * 6) + 1;
            falar(`O dado parou no ${numero}`);
            return;
        }
        
        // Piada
        else if (cmd.includes("piada")) {
            const piadas = [
                "Por que o computador foi ao médico? Porque estava com vírus!",
                "Qual é o animal mais velho do mundo? A zebra, porque ainda é preta e branca!",
                "O que o pato disse para a pata? Viemos aqui para QUÁ!",
                "Por que o HTML não foi à festa? Porque ele não tinha CLASS!"
            ];
            falar(piadas[Math.floor(Math.random() * piadas.length)]);
            return;
        }
        
        // Curiosidade
        else if (cmd.includes("curiosidade")) {
            const curiosidades = [
                "O primeiro computador pesava mais de 27 toneladas!",
                "O Python foi nomeado por causa do Monty Python, não da cobra.",
                "O Android foi criado para câmeras digitais antes de ser comprado pelo Google.",
                "O primeiro programa de computador foi escrito por uma mulher, Ada Lovelace."
            ];
            falar(curiosidades[Math.floor(Math.random() * curiosidades.length)]);
            return;
        }
        
        // Navegação
        else if (cmd.includes("youtube") || cmd.includes("tube")) {
            window.open("https://youtube.com", "_blank");
            falar("Abrindo YouTube");
        }
        else if (cmd.includes("google")) {
            window.open("https://google.com", "_blank");
            falar("Abrindo Google");
        }
        else if (cmd.includes("github")) {
            window.open("https://github.com", "_blank");
            falar("Abrindo GitHub");
        }
        else if (cmd.includes("gmail")) {
            window.open("https://gmail.com", "_blank");
            falar("Abrindo Gmail");
        }
        else if (cmd.includes("spotify")) {
            window.open("https://open.spotify.com", "_blank");
            falar("Abrindo Spotify");
        }
        else if (cmd.includes("netflix")) {
            window.open("https://netflix.com", "_blank");
            falar("Abrindo Netflix");
        }
        
        // Pesquisar
        else if (cmd.includes("pesquisar") || cmd.includes("buscar")) {
            let busca = cmd.replace("pesquisar", "").replace("buscar", "").trim();
            if (busca === "") falar("O que você quer pesquisar?");
            else {
                window.open(`https://google.com/search?q=${encodeURIComponent(busca)}`, "_blank");
                falar(`Pesquisando ${busca} no Google`);
            }
        }
        
        // Notícias
        else if (cmd.includes("notícias") || cmd.includes("noticias")) {
            window.open("https://news.google.com", "_blank");
            falar("Abrindo as últimas notícias");
        }
        
        // Hora e Data
        else if (cmd.includes("que horas são") || cmd.includes("horas")) {
            const agora = new Date();
            falar(`São ${agora.toLocaleTimeString('pt-BR')}`);
        }
        else if (cmd.includes("data") || cmd.includes("hoje é")) {
            falar(`Hoje é ${new Date().toLocaleDateString('pt-BR')}`);
        }
        
        // Saudação
        else if (cmd.includes("olá") || cmd.includes("ola")) {
            falar("Olá! Como posso ajudar?");
        }
        else if (cmd.includes("bom dia")) {
            falar("Bom dia! Tenha um excelente dia!");
        }
        else if (cmd.includes("boa tarde")) {
            falar("Boa tarde! Como posso auxiliar?");
        }
        else if (cmd.includes("boa noite")) {
            falar("Boa noite! Descanse bem.");
        }
        else if (cmd.includes("obrigado") || cmd.includes("obrigada")) {
            falar("De nada! Estou aqui para ajudar.");
        }
        else if (cmd.includes("tchau") || cmd.includes("adeus") || cmd.includes("até logo")) {
            falar("Até logo! Quando precisar, é só chamar.");
        }
        
        // Rolagem
        else if (cmd.includes("rolar para baixo")) {
            window.scrollBy(0, 400);
            falar("Rolando para baixo");
        }
        else if (cmd.includes("rolar para cima")) {
            window.scrollBy(0, -400);
            falar("Rolando para cima");
        }
        
        // Print
        else if (cmd.includes("print") || cmd.includes("screenshot")) {
            if (typeof html2canvas !== 'undefined') {
                html2canvas(document.body).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `print_${Date.now()}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    falar("Print da página salvo");
                }).catch(() => falar("Erro ao tirar print"));
            } else {
                falar("Biblioteca de print não carregada");
            }
        }
        
        // Fale
        else if (cmd.includes("fale")) {
            let texto = cmd.replace("fale", "").trim();
            if (texto) falar(texto);
            else falar("Diga o que devo falar após 'fale'");
        }
        
        // Ajuda
        else if (cmd.includes("ajuda") || cmd.includes("comandos") || cmd.includes("o que você faz")) {
            const comandosLista = [
                "📋 COMANDOS DISPONÍVEIS:",
                "🎤 hora, data, clima (depois a cidade)",
                "📱 whatsapp + mensagem + para + contato",
                "📝 lembrar (depois o lembrete), meus lembretes",
                "🎵 tocar música + nome",
                "🎲 cara ou coroa, jogar dado",
                "😂 piada, curiosidade",
                "🔍 pesquisar + assunto, notícias",
                "📧 abrir youtube, google, gmail, spotify, netflix, github",
                "📸 print, rolar para cima/baixo",
                "❓ ajuda, tchau, obrigado"
            ];
            falar(comandosLista.join(". "));
        }
        
        // Criador
        else if (cmd.includes("quem te criou") || cmd.includes("criador")) {
            falar("Fui criada pelo João Altafini, um programador brasileiro!");
        }
        
        // Como está
        else if (cmd.includes("como você está")) {
            falar("Estou online e funcionando! Pronta para ajudar.");
        }
        
        // Fallback
        else {
            falar("Não entendi esse comando. Diga 'JA ajuda' para ver os comandos disponíveis.");
        }
    }
    
    // Reconhecimento de voz
    if (recognition) {
        recognition.onstart = () => {
            statusSpan.innerText = "🎤 Ouvindo... Fale o comando";
            micBtn.classList.add('mic-active');
        };
        recognition.onend = () => {
            micBtn.classList.remove('mic-active');
            if (!aguardandoCidade && !aguardandoWhatsApp && !aguardandoLembrete) 
                statusSpan.innerText = "⚡ Aguardando ativação...";
        };
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            addMessage(transcript, true);
            processarComando(transcript);
        };
        recognition.onerror = (e) => {
            console.error(e);
            statusSpan.innerText = "❌ Erro no microfone";
            micBtn.classList.remove('mic-active');
        };
    }
    
    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        try { recognition.start(); } 
        catch(e) { statusSpan.innerText = "Já está ouvindo"; }
    });
    
    clearChatBtn.addEventListener('click', () => {
        while (chatArea.children.length > 2) {
            chatArea.removeChild(chatArea.lastChild);
        }
        falar("Chat limpo!");
    });
    
    helpBtn.addEventListener('click', () => {
        falar("Comandos: hora, data, clima, pesquisar, tocar música, lembrete, whatsapp, piada, curiosidade, cara ou coroa, dado, abrir youtube, google, spotify, netflix, gmail, github, print, rolar, fale, tchau, obrigado, quem te criou, como você está. Diga JA ajuda para mais detalhes");
    });
    
    whatsappBtn.addEventListener('click', () => {
        window.open("https://web.whatsapp.com", "_blank");
        falar("Abrindo WhatsApp Web");
    });
    
    historyToggle.addEventListener('click', () => {
        historyPanel.classList.add('open');
    });
    
    closeHistory.addEventListener('click', () => {
        historyPanel.classList.remove('open');
    });
    
    clearHistoryBtn.addEventListener('click', () => {
        historicoMensagens = [];
        salvarHistorico();
        falar("Histórico limpo!");
    });
    
    atualizarHistoricoUI();
    
    // Boas-vindas
    setTimeout(() => {
        falar("Assistente JA ativada! Fale JA e um comando");
    }, 500);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
